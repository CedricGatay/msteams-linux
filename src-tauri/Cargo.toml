[package]
name = "msteams-tauri"
version = "1.0.0"
description = "Unofficial Microsoft Teams desktop wrapper built with Tauri"
authors = ["msteams-tauri contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "msteams_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
plist = "1"

# Used on Linux to reach the underlying WebKitGTK webview and apply the settings
# Teams requires (third-party cookies, MediaCapabilities and WebRTC). The feature
# set mirrors the one wry already enables for this crate so both resolve to the
# same version.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_38"] }
gtk = "0.18"
gio = "0.18"
glib = "0.18"

# Native macOS Keychain API; session-cookie values never touch plaintext files.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSOpenPanel", "NSSavePanel", "NSRunningApplication"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString", "NSObject", "NSError", "NSURL"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationContent", "UNNotificationSound", "UNNotificationSettings", "UNNotificationResponse"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
